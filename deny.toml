# cargo-deny configuration — see .github/workflows/security.yml.
# CI runs `cargo deny check advisories licenses` over ALL features: rmcp (client) and
# wasmtime (plugins) are not in `default`, and a default-only graph cannot see them.
[graph]
all-features = true

[advisories]
version = 2
# Fail on security vulnerabilities (the default). Yanked crates warn only.
yanked = "warn"
# Accept a specific advisory by adding its id here WITH a note explaining why.
ignore = [
    # 2026-11-21: unmaintained notices only (no vulnerability). Review by 2027-02-21;
    # drop each as soon as its removal condition below is met.
    # chrono is a direct cxpak dependency and is also pulled by rmcp 3.x (schemars chrono04).
    "RUSTSEC-2026-0543",
    # paste is a proc-macro pulled by gemm via candle-core; remove when candle drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    # webpki-roots: Mozilla CA root data (rustls/webpki-roots); CDLA-Permissive-2.0 is a permissive data licence.
    "CDLA-Permissive-2.0",
]

# tree-sitter-graphql 0.1.0 (github.com/joowani/tree-sitter-graphql) has no SPDX
# `license` field, only `license-file = "LICENSE"`, whose text is the MIT licence.
[[licenses.clarify]]
crate = "tree-sitter-graphql"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xda88ff2a }]
