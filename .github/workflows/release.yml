name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release: full pipeline
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # prerelease (e.g. -rc.1): build + image only

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false   # one target failing shouldn't cancel/mask the others
      matrix:
        include:
          # .github#20: a *-unknown-linux-gnu binary links whatever newer glibc symbols
          # std/its deps reference IF the build host's glibc has them — e.g.
          # pidfd_spawnp/pidfd_getpid (GLIBC_2.39), which std::process::Command links
          # when present, silently raising the shipped binary's floor past Debian 12
          # (2.36), Ubuntu 22.04 LTS (2.35), RHEL 9, and Amazon Linux 2023 (2.34 each)
          # every time `os: ubuntu-latest` promotes to a newer glibc. `cargo-zigbuild`
          # (zig as the C compiler/linker, bundling its own libc headers per glibc
          # version) decouples the floor from the build host entirely: `--target
          # <triple>.2.28` always produces a binary needing at most GLIBC_2.28,
          # regardless of what `ubuntu-latest` resolves to this month — verified
          # locally via readelf before this PR (objdump cannot read the aarch64
          # binary on an x86_64 host at all — see the GLIBC floor gate step
          # below; including this repo's `git2`/libgit2/jemallocator native
          # deps, all cross-compile fine via zig cc): max required symbol
          # GLIBC_2.28 on both linux targets, zero GLIBC_2.39
          # references. 2.28 is chosen, not forced by a dependency: it is the floor
          # that still covers all four named distros with room (RHEL 9/AL2023 are
          # the tightest at 2.34).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # branch stable
        with:
          targets: ${{ matrix.target }}

      # zig provides its own cross-linker + per-glibc-version libc headers, so
      # neither linux-gnu row needs a system cross-compiler (gcc-aarch64-linux-gnu)
      # any more — zigbuild replaces that step for both rows, not just aarch64.
      - name: Install zig
        if: matrix.glibc != ''
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.glibc != ''
        run: |
          cargo install cargo-zigbuild --locked --version 0.23.4
          zig version
          cargo-zigbuild --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --features daemon --locked --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --release --features daemon --locked --target "${{ matrix.target }}"
          fi

      # The regression test for the floor declared above: a future std/dependency
      # bump that starts referencing a newer symbol (or a zig/libc-headers bump)
      # fails HERE instead of shipping unnoticed — the same way this whole class of
      # bug reached GA the first time (.github#20). ci/glibc-floor.sh (self-tested
      # in ci.yml against a fixture, so this gate has actually been shown to fail)
      # uses `readelf`, not `objdump`: the release runner's native objdump cannot
      # read the aarch64 row's binary at all ("file format not recognized" —
      # objdump dispatches to a per-architecture BFD backend; readelf parses the
      # ELF structures directly and has no such restriction) and that row would
      # fail every release without ever reaching this check.
      - name: GLIBC floor gate
        if: matrix.glibc != ''
        shell: bash
        run: ci/glibc-floor.sh "target/${{ matrix.target }}/release/cxpak" "${{ matrix.glibc }}"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cxpak-${{ matrix.target }}.tar.gz cxpak
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/cxpak.exe -DestinationPath cxpak-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: cxpak-${{ matrix.target }}
          path: cxpak-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage per-arch binaries for Dockerfile.dist
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64
          tar -xzf artifacts/cxpak-x86_64-unknown-linux-gnu.tar.gz -C dist/linux/amd64/
          tar -xzf artifacts/cxpak-aarch64-unknown-linux-gnu.tar.gz -C dist/linux/arm64/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # COPY-only Dockerfile.dist needs no QEMU: buildx assembles the manifest
      # from the prebuilt per-arch binaries.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}   # skip crates.io on prerelease tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # branch stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}   # skip Homebrew tap on prerelease tags
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          SHA_LINUX_X86=$(sha256sum artifacts/cxpak-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum artifacts/cxpak-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA_MAC_X86=$(sha256sum artifacts/cxpak-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_MAC_ARM=$(sha256sum artifacts/cxpak-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${TAP_TOKEN}@github.com/Barnett-Studios/homebrew-tap.git tap
          cd tap
          mkdir -p Formula

          cat > Formula/cxpak.rb << 'RUBY'
          class Cxpak < Formula
            desc "Token-budgeted codebase context for LLMs"
            homepage "https://github.com/Barnett-Studios/cxpak"
          RUBY

          cat >> Formula/cxpak.rb << EOF
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Barnett-Studios/cxpak/releases/download/v${VERSION}/cxpak-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/Barnett-Studios/cxpak/releases/download/v${VERSION}/cxpak-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Barnett-Studios/cxpak/releases/download/v${VERSION}/cxpak-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/Barnett-Studios/cxpak/releases/download/v${VERSION}/cxpak-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "cxpak"
            end

            test do
              system "#{bin}/cxpak", "--help"
            end
          end
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/cxpak.rb
          git diff --cached --quiet || git commit -m "Update cxpak to ${VERSION}"
          git push
